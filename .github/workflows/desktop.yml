name: Desktop clients

on:
  push:
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            name: macOS-arm64
            bundles: app,dmg
          - os: macos-15-intel
            name: macOS-x64
            bundles: app,dmg
          - os: windows-2022
            name: Windows-x64
            bundles: nsis
          - os: ubuntu-22.04
            name: Linux-x64
            bundles: deb,appimage
          - os: ubuntu-22.04-arm
            name: Linux-arm64
            bundles: deb
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.name }}
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev libxdo-dev
      - run: npm ci
      - name: Check release version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION=$(node -p "require('./package.json').version")
            test "$GITHUB_REF_NAME" = "v$VERSION"
          fi
      - run: npm test
      - run: go test -race ./...
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Build desktop installer
        env:
          NO_STRIP: 'true'
        run: npm run desktop:build -- --bundles ${{ matrix.bundles }}
      - name: Collect release packages
        env:
          PACKAGE_PLATFORM: ${{ matrix.name }}
        run: python scripts/collect-release.py
      - uses: actions/upload-artifact@v4
        with:
          name: Fangxu-File-Transfer-${{ matrix.name }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: Fangxu-File-Transfer-*
          merge-multiple: true
          path: release-assets
      - name: Generate checksums
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt
      - name: Publish installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "方序传文件 $GITHUB_REF_NAME" \
            --notes-file docs/release-notes.md \
            --latest
