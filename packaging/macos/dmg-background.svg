<svg xmlns="http://www.w3.org/2000/svg" width="660" height="400" viewBox="0 0 660 400">
  <rect width="660" height="400" fill="#f0f3ff"/>
  <g text-anchor="middle" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">
    <text x="330" y="64" font-size="26" font-weight="600" fill="#26345e">拖动到 Applications 即可安装</text>
    <text x="330" y="96" font-size="15" fill="#677394">Drag the app into Applications to install</text>
    <text x="330" y="328" font-size="15" fill="#677394">安装后，从「应用程序」打开方序传文件</text>
    <text x="330" y="352" font-size="13" fill="#677394">Once installed, open Fangxu File Transfer from Applications</text>
