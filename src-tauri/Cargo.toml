[package]
name = "fangxu-file-transfer-desktop"
version = "1.1.0"
description = "Cross-platform LAN file transfer desktop client"
authors = ["fangxu"]
edition = "2021"

[lib]
name = "fangxu_file_transfer_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "~2.11", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
rfd = "0.15"
