# Existing public WeChat login endpoints, available on the feedback origin.
location = /api/users/verify-code {
    limit_except GET { deny all; }
    proxy_pass http://127.0.0.1:5227;
    proxy_set_header Host x.ip21.cn;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    add_header Cache-Control "no-store" always;
}
location = /api/users/login-status {
    limit_except GET { deny all; }
    proxy_pass http://127.0.0.1:5227;
    proxy_set_header Host x.ip21.cn;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    add_header Cache-Control "no-store" always;
    access_log off;
}
